<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>课程管理</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../../js/getData.js"></script>
    <script src="../../js/login.js"></script>

</head>
<body>

<!-- Compact top bar: avatar, name/college, 私聊 and 退出 -->
<div class="topbar">
    <div class="topbar-inner">
        <div class="topbar-info">
            <img id="topbarAvatar" class="topbar-avatar" src="https://picsum.photos/id/1005/44/44" alt="avatar">
            <div class="topbar-text">
                <div id="topbarName" class="topbar-name">testname</div>
                <div id="topbarCollege" class="topbar-college">软件学院</div>
            </div>
        </div>
        <div class="topbar-actions">
            <!-- Chat icon button -->
            <button class="icon-btn" id="chatBtn" onclick="gotoChats()" aria-label="私聊" title="私聊">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="8" cy="11" r="1" fill="currentColor"/>
                    <circle cx="12" cy="11" r="1" fill="currentColor"/>
                    <circle cx="16" cy="11" r="1" fill="currentColor"/>
                </svg>
            </button>
            <!-- Logout icon button -->
            <button id="logoutBtn" class="icon-btn logout-icon" onclick="exitButtonFunc()" aria-label="退出" title="退出">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M13 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<div class="container">


    <div class="tab-nav">
        <a href="#" onclick="tabNavsControl(0)" class="active">我学的课</a>
        <a href="#" onclick="tabNavsControl(1)">订阅</a>
        <a href="#" onclick="tabNavsControl(2)">签到</a>
        <a href="#" onclick="tabNavsControl(3)">学习报告</a>
    </div>

    <div class="course-list">
        <div class="course-card" data-course-id="1">
            <img src="https://picsum.photos/id/101/300/200" alt="嵌入式系统板级电路装配">
            <h3>嵌入式系统板级电路装配 2025-2028-1</h3>
            <p>嵌入式系统、电路设计、硬件开发</p>
            <div class="meta">
                <span>2025-09-01</span>
                <span>16学分</span>
            </div>
            <div class="actions">
                <button class="icon-action chat" title="私聊" aria-label="私聊" onclick="gotoChats(this.closest('.course-card').dataset.courseId)">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="icon-action quiz" title="做题" aria-label="做题" onclick="gotoDoExercises(this.closest('.course-card').dataset.courseId)">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2l3 6 6 .5-4.5 3.5L19 22l-7-4-7 4 1.5-9L2 8.5 8 8 12 2z" fill="currentColor"/></svg>
                </button>
                <button class="icon-action subscribe" title="订阅" aria-label="订阅" onclick="toggleSubscribe(this.closest('.course-card').dataset.courseId, this)">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 2h12v20l-6-4-6 4V2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

        </div>

                </button>
                <button class="icon-action subscribe" title="订阅" aria-label="订阅" onclick="toggleSubscribe(this.closest('.course-card').dataset.courseId, this)">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 2h12v20l-6-4-6 4V2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </div>
        <div class="course-card" data-course-id="4">
            <img src="https://picsum.photos/id/104/300/200" alt="FPGA微机课程设计">

                </button>
                <button class="icon-action quiz" title="做题" aria-label="做题" onclick="gotoDoExercises(this.closest('.course-card').dataset.courseId)">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2l3 6 6 .5-4.5 3.5L19 22l-7-4-7 4 1.5-9L2 8.5 8 8 12 2z" fill="currentColor"/></svg>
                </button>
                <button class="icon-action subscribe" title="订阅" aria-label="订阅" onclick="toggleSubscribe(this.closest('.course-card').dataset.courseId, this)">

                </button>
            </div>
        </div>
    </div>
</div>
<script>

    initStudentDashboard();

    // set topbar avatar/name/college from stored user info if available
    document.addEventListener('DOMContentLoaded', ()=>{
        try{
            const avatar = document.getElementById('topbarAvatar');
            const nameEl = document.getElementById('topbarName');
            const collegeEl = document.getElementById('topbarCollege');
            if (!avatar && !nameEl && !collegeEl) return;
            let u = null;
            if (typeof getLocalUser === 'function') u = getLocalUser();
            if (!u && typeof getCurrentUser === 'function') u = getCurrentUser();
            if (u) {
                if (u.avatarUrl && avatar) { avatar.src = u.avatarUrl; avatar.alt = u.name || 'avatar'; }
                if (u.name && nameEl) nameEl.textContent = u.name;
                if (u.college && collegeEl) collegeEl.textContent = u.college;
            }
        }catch(e){ console.warn('set topbar info failed', e); }
    });
</script>
</body>
</html>
