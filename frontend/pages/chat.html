<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>聊天</title>
    <link rel="stylesheet" href="../pages/css/chat.css">
    <script src="../js/login.js"></script>
</head>
<body>
<div class="chat-app">
    <!-- left sidebar: user list and avatars -->
    <aside class="chat-sidebar">
        <div class="sidebar-header">联系人</div>
        <ul id="userList" class="user-list">
            <!-- populated by chat.js -->
        </ul>
    </aside>

    <!-- right: chat content -->
    <div class="chat-content">
        <header class="chat-header">
            <div class="chat-title">课堂聊天</div>
            <!-- mobile participants toggle (icon) and logout icon -->
            <div style="display:flex;align-items:center;gap:8px">
                <button id="participantsToggle" class="icon-btn small" aria-label="切换联系人列表" title="联系人">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-3-3.87" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21v-2a4 4 0 0 1 3-3.87" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button id="chatLogoutBtn" class="icon-btn" aria-label="退出" title="退出">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
            <div class="chat-user" id="chatUser">匿名</div>
        </header>

        <main class="chat-main">
            <ul id="messages" class="messages" aria-live="polite"></ul>
        </main>

        <footer class="chat-footer">
            <textarea id="messageInput" placeholder="输入消息，按回车发送（支持换行：Shift+Enter）"></textarea>
            <div class="controls">
                <button id="sendBtn" class="btn primary">发送</button>
                <button id="clearBtn" class="btn">清空</button>
            </div>
        </footer>
    </div>
</div>

<script src="../js/getData.js"></script>
<script src="../js/chat.js"></script>

</body>
</html>
